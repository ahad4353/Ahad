
<!DOCTYPE html>
<html>
<head>
  <title>BetterOne Fashion</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f4f4f4;
      margin: 0;
    }
    header {
      background: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      padding: 10px;
      text-align: center;
    }
    .product img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    .btn {
      background: green;
      color: white;
      padding: 10px;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <h1>BetterOne Fashion</h1>
    <p>Premium Punjabi, Formal Pant & Shirt Collection</p>
  </header>

  <div class="products">
    <div class="product">
      <img src="product1.jpg" alt="Punjabi 1">
      <h3>Royal Blue Punjabi</h3>
      <p>৳ 1200</p>
      <a href="https://wa.me/8801887205021?text=I want to order Royal Blue Punjabi" class="btn">Order Now</a>
    </div>

    <div class="product">
      <img src="product2.jpg" alt="Pant 1">
      <h3>Classic Black Formal Pant</h3>
      <p>৳ 950</p>
      <a href="https://wa.me/8801887205021?text=I want to order Classic Black Formal Pant" class="btn">Order Now</a>
    </div>

    <div class="product">
      <img src="product3.jpg" alt="Shirt 1">
      <h3>Slim Fit White Shirt</h3>
      <p>৳ 850</p>
      <a href="https://wa.me/8801887205021?text=I want to order Slim Fit White Shirt" class="btn">Order Now</a>
    </div>
  </div>
</body>
</html>
